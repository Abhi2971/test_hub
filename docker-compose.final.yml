version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: examsaas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-examsaas}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT:-2g}
          cpus: '${MONGO_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${MONGO_MEMORY_RESERVATION:-512m}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: examsaas_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Flask Backend API
  flask:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examsaas/flask:latest
    container_name: examsaas_flask
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB:-examsaas}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "${FLASK_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${FLASK_MEMORY_LIMIT:-1g}
          cpus: '${FLASK_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${FLASK_MEMORY_RESERVATION:-256m}'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    command: gunicorn --bind 0.0.0.0:5000 --workers ${GUNICORN_WORKERS:-4} --timeout 120 --access-logfile - "app:create_app()"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: examsaas/frontend:latest
    container_name: examsaas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${API_URL}/api/v1
      VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - flask
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
          cpus: '${FRONTEND_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${FRONTEND_MEMORY_RESERVATION:-128m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: examsaas_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - flask
      - frontend
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-128m}
          cpus: '${NGINX_CPU_LIMIT:-0.25}'
        reservations:
          memory: ${NGINX_MEMORY_RESERVATION:-32m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Celery Worker (Default Queue)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examsaas/celery:latest
    container_name: examsaas_celery_worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q default,email,results --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-production}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    deploy:
      resources:
        limits:
          memory: ${CELERY_MEMORY_LIMIT:-1g}
          cpus: '${CELERY_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${CELERY_MEMORY_RESERVATION:-256m}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examsaas/celery:latest
    container_name: examsaas_celery_beat
    restart: no
    command: celery -A app.celery beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-production}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/celerybeat-schedule
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    deploy:
      resources:
        limits:
          memory: ${CELERY_BEAT_MEMORY_LIMIT:-256m}
          cpus: '${CELERY_BEAT_CPU_LIMIT:-0.25}'
        reservations:
          memory: ${CELERY_BEAT_MEMORY_RESERVATION:-64m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Celery AI Worker (AI Queue - Long Running Tasks)
  celery-ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examsaas/celery:latest
    container_name: examsaas_celery_ai
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q ai_queue --concurrency=${CELERY_AI_CONCURRENCY:-2}
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-production}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    deploy:
      resources:
        limits:
          memory: ${CELERY_AI_MEMORY_LIMIT:-2g}
          cpus: '${CELERY_AI_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${CELERY_AI_MEMORY_RESERVATION:-512m}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Celery PDF Worker (PDF Generation Queue)
  celery-pdf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examsaas/celery:latest
    container_name: examsaas_celery_pdf
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q pdf,certificates --concurrency=${CELERY_PDF_CONCURRENCY:-2}
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-production}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    volumes:
      - ./backend:/app
      - pdf_storage:/app/generated_pdfs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    deploy:
      resources:
        limits:
          memory: ${CELERY_PDF_MEMORY_LIMIT:-1g}
          cpus: '${CELERY_PDF_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${CELERY_PDF_MEMORY_RESERVATION:-256m}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis Exporter for Prometheus
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: examsaas_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_EXPORTER_PORT:-9090}:9121"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: 0.25
        reservations:
          memory: 32m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # MongoDB Exporter for Prometheus
  mongo_exporter:
    image: percona/mongodb_exporter:latest
    container_name: examsaas_mongo_exporter
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGO_URI}
      MONGODB_DATABASE: ${MONGO_DB:-examsaas}
    ports:
      - "${MONGO_EXPORTER_PORT:-9091}:9216"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.5
        reservations:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  examsaas_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  mongo_data:
    name: examsaas_mongo_data
  redis_data:
    name: examsaas_redis_data
  pdf_storage:
    name: examsaas_pdf_storage
  uploads_data:
    name: examsaas_uploads_data
  celery_beat_data:
    name: examsaas_celery_beat_data
  nginx_logs:
    name: examsaas_nginx_logs
