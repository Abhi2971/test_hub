version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: examsaas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: examsaas
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: examsaas_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Flask Backend API
  flask:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsaas_flask
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: flask run --host 0.0.0.0 --port 5000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examsaas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${API_URL}/api/v1
      VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:80"
    depends_on:
      - flask
    networks:
      - examsaas_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: examsaas_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - flask
      - frontend
    networks:
      - examsaas_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker (Default Queue)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsaas_celery_worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q default
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-development}
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - mongo
    networks:
      - examsaas_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsaas_celery_beat
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-development}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - mongo
    networks:
      - examsaas_network

  # Celery AI Worker (AI Queue - Long Running Tasks)
  celery-ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsaas_celery_ai
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q ai_queue --concurrency=2
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-development}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - mongo
    networks:
      - examsaas_network

  # Celery PDF Worker (PDF Generation Queue)
  celery-pdf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsaas_celery_pdf
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info -Q pdf,certificates
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV:-development}
    volumes:
      - ./backend:/app
      - pdf_storage:/app/generated_pdfs
    depends_on:
      - redis
      - mongo
    networks:
      - examsaas_network

networks:
  examsaas_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  pdf_storage:
